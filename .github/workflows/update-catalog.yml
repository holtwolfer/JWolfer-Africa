
name: Update African Collection Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'content/artifacts/**'
      - 'scripts/build_catalog.py'
      - '.github/workflows/update-catalog.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild catalog
        run: python scripts/build_catalog.py

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatically update artifact catalog"
            git push
          fi
